name: PR Agent (Gemini)
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@d611e54a4600ccef3c67eb3c75f6bdf7aa274ca8 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-3.5-flash-lite"
          config.fallback_models: '["gemini/gemini-3.5-pro", "gemini/gemini-2.5-pro", "gemini/gemini-1.5-pro"]'
          config.custom_model_max_tokens: '{"gemini/gemini-3.5-flash-lite": 1000000, "gemini/gemini-3.5-pro": 2000000, "gemini/gemini-2.5-pro": 2000000, "gemini/gemini-1.5-pro": 2000000, "gemini/gemini-3.1-flash-lite": 1000000}'
          pr_description.enable_diagram: "true"
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"